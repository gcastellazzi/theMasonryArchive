name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Un archivio incoerente non deve arrivare online: immagini mancanti,
      # id duplicati, record approvati ma incompleti. Python 3 e' gia' sul
      # runner e la validazione non richiede ImageMagick.
      - name: Validate the archive
        run: npm run validate

      - name: Build
        run: npm run build
        env:
          # URL pubblico da cui arrivano le derivate da 1600 px, escluse dal
          # repository. Sta in una repository variable, non fra i segreti: e'
          # un indirizzo pubblico. Se non e' impostata, la scheda del record
          # ripiega sulla derivata da 480 px versionata.
          VITE_IMAGE_CDN: ${{ vars.VITE_IMAGE_CDN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
